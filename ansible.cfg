[defaults]
inventory = inventory/hosts.ini
roles_path = roles
interpreter_python = auto_silent
# The old "yaml" callback lived in community.general and was removed in
# version 12. ansible-core renders YAML natively with result_format.
result_format = yaml
retry_files_enabled = False
forks = 10
timeout = 30

# A new cloud VM presents a new host key every time.
# Set this to True if you keep long-lived hosts in the inventory.
host_key_checking = False

[privilege_escalation]
become_method = sudo
become_ask_pass = False

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=120s -o ServerAliveInterval=30
