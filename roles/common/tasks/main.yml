---
- name: Update the apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
    lock_timeout: "{{ common_apt_lock_timeout }}"
  register: common_apt_update
  until: common_apt_update is succeeded
  retries: 5
  delay: 15

- name: Install the base packages
  ansible.builtin.apt:
    name: "{{ common_packages + common_extra_packages }}"
    state: present
    lock_timeout: "{{ common_apt_lock_timeout }}"

- name: Set the timezone
  community.general.timezone:
    name: "{{ timezone }}"

- name: Set the hostname
  ansible.builtin.hostname:
    name: "{{ common_hostname }}"
  when: common_hostname | length > 0

- name: Make the hostname resolvable in /etc/hosts
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: '^127\.0\.1\.1\s'
    line: "127.0.1.1 {{ common_hostname }}"
    state: present
  when: common_hostname | length > 0

- name: Install unattended-upgrades
  ansible.builtin.apt:
    name:
      - unattended-upgrades
      - apt-listchanges
    state: present
    lock_timeout: "{{ common_apt_lock_timeout }}"
  when: common_unattended_upgrades | bool

- name: Turn on automatic security upgrades
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    owner: root
    group: root
    mode: "0644"
    content: |
      // Managed by Ansible
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
      APT::Periodic::AutocleanInterval "7";
  when: common_unattended_upgrades | bool
  notify: Restart unattended-upgrades
