---
- name: Install fail2ban
  ansible.builtin.apt:
    name:
      - fail2ban
      # The systemd backend reads the journal through these bindings.
      - python3-systemd
    state: present

- name: Configure the sshd jail
  ansible.builtin.template:
    src: sshd.local.j2
    dest: /etc/fail2ban/jail.d/sshd.local
    owner: root
    group: root
    mode: "0644"
  notify: Restart fail2ban

- name: Start fail2ban on boot
  ansible.builtin.service:
    name: fail2ban
    enabled: true
    state: started
