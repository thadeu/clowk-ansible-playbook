---
- name: Read the active swap devices
  ansible.builtin.command: swapon --noheadings --show=NAME
  register: swap_active
  changed_when: false

- name: Look for the swap file
  ansible.builtin.stat:
    path: "{{ swap_file }}"
  register: swap_file_stat

# Manage the swap file when the role owns it already, or when the image
# came with no swap at all. Do not touch an image that boots from a swap
# partition.
- name: Decide whether to manage a swap file
  ansible.builtin.set_fact:
    swap_manage: >-
      {{ swap_enabled | bool
         and (swap_file_stat.stat.exists or swap_active.stdout | trim | length == 0) }}

- name: Report a swap partition that the role leaves alone
  ansible.builtin.debug:
    msg: >-
      The image already uses swap on {{ swap_active.stdout_lines | join(', ') }}.
      The role creates no swap file.
  when:
    - swap_enabled | bool
    - not swap_manage | bool

- name: Manage the swap file
  when: swap_manage | bool
  block:
    - name: Allocate the swap file
      ansible.builtin.command:
        cmd: "fallocate -l {{ swap_size }} {{ swap_file }}"
        creates: "{{ swap_file }}"
      register: swap_allocated

    - name: Restrict the swap file to root
      ansible.builtin.file:
        path: "{{ swap_file }}"
        owner: root
        group: root
        mode: "0600"

    # A handler would run at the end of the play, after "swapon" already
    # failed on an unformatted file. This has to stay inline.
    - name: Format the swap file  # noqa: no-handler
      ansible.builtin.command:
        cmd: "mkswap {{ swap_file }}"
      when: swap_allocated is changed
      changed_when: true

    - name: Add the swap file to /etc/fstab
      ansible.posix.mount:
        path: none
        src: "{{ swap_file }}"
        fstype: swap
        opts: sw
        state: present

    - name: Turn the swap file on
      ansible.builtin.command:
        cmd: "swapon {{ swap_file }}"
      when: swap_file not in swap_active.stdout
      changed_when: true

- name: Set vm.swappiness
  ansible.posix.sysctl:
    name: vm.swappiness
    value: "{{ swap_swappiness }}"
    sysctl_file: /etc/sysctl.d/60-ansible-swap.conf
    state: present
    reload: true

- name: Set vm.vfs_cache_pressure
  ansible.posix.sysctl:
    name: vm.vfs_cache_pressure
    value: "{{ swap_vfs_cache_pressure }}"
    sysctl_file: /etc/sysctl.d/60-ansible-swap.conf
    state: present
    reload: true
